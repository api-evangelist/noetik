name: Noetik
description: >-
  Noetik is an AI-native biotechnology company headquartered in South San
  Francisco, California, focused on discovering and developing cancer therapies
  with machine learning. The company has assembled one of the largest multimodal
  tumor datasets and trained foundation models (including its OCTO world model
  for cancer biology) to represent tumor microenvironments and simulate spatial
  biology with virtual cells. Its platform spans human data generation,
  foundation models, and therapeutic applications aimed at enriching clinical
  trials, repositioning drugs to the right patient populations, and discovering
  novel oncology targets. Noetik is backed by DCVC. As of this profile the
  company publishes no public API, developer portal, SDKs, or API documentation;
  this record captures its public web and organizational surface for the API
  Evangelist network.
